<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leon Craft 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }

    #start-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #1a0a2e 0%, #0d47a1 50%, #4caf50 100%);
      z-index: 100; cursor: pointer;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #start-screen h1 {
      font-size: 72px; font-weight: 900;
      color: #fff; text-shadow: 4px 4px 0 #000, -2px -2px 0 #4caf50;
      letter-spacing: 4px; margin-bottom: 8px;
      font-family: 'Courier New', monospace;
    }
    #start-screen .subtitle {
      font-size: 18px; color: rgba(255,255,255,0.7);
      margin-bottom: 48px;
    }
    #start-screen .play-btn {
      font-size: 24px; padding: 16px 48px;
      background: #4caf50; color: #fff; border: 4px solid #2e7d32;
      font-weight: bold; cursor: pointer;
      font-family: 'Courier New', monospace;
      text-shadow: 2px 2px 0 #000;
      transition: transform 0.1s;
    }
    #start-screen .play-btn:hover { transform: scale(1.05); background: #66bb6a; }
    #start-screen.hidden { display: none; }

    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-size: 24px; font-weight: 100;
      pointer-events: none; z-index: 10;
      text-shadow: 0 0 2px #000;
      font-family: monospace;
    }

    #hotbar {
      position: fixed; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 2px;
      pointer-events: none; z-index: 10;
    }
    .hotbar-slot {
      width: 48px; height: 48px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .hotbar-slot.active { border-color: #fff; background: rgba(255,255,255,0.15); }
    .hotbar-slot .slot-num {
      position: absolute; top: 1px; left: 3px;
      font-size: 10px; color: rgba(255,255,255,0.5);
      font-family: monospace;
    }
    .hotbar-slot .block-icon {
      width: 32px; height: 32px;
      image-rendering: pixelated;
    }

    #debug {
      position: fixed; top: 8px; left: 8px;
      color: #fff; font-family: monospace; font-size: 12px;
      pointer-events: none; z-index: 10;
      text-shadow: 1px 1px 0 #000;
      display: none;
    }
    #debug.visible { display: block; }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>LEON CRAFT 3D</h1>
    <div class="subtitle">A Minecraft-like adventure</div>
    <button class="play-btn">CLICK TO PLAY</button>
  </div>
  <div id="crosshair">+</div>
  <div id="hotbar"></div>
  <div id="debug"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
